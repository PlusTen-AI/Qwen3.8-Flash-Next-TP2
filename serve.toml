# serve.toml — every setting of the server, with its default. Do not edit this file for your machines: copy
# serve.local.toml.example to serve.local.toml (not tracked by git) and set what differs there.
# Precedence: command line (--set section.key=value) > environment (Q38_<SECTION>_<KEY>) > serve.local.toml > this file.

[cluster]
# The worker node (rank 1) as `ssh` reaches it from the head node: "user@host" or a name from ~/.ssh/config. Required.
worker = ""
# The worker's address(es) on the direct CX7 link. Empty = the host part of `worker` (which must then be a CX7 address).
# One address is enough: the other half of the same CX7 port (each GB10 CX7 port shows up as two RDMA devices) is
# found on both nodes at every start and used as a second rail. List one address per rail to choose them yourself.
worker_addr = []
# Rails: 0 = all that were found (the routed device and its sibling), 1 = only the routed device.
rails = 0
# RoCE v2 GID index for NCCL; -1 = read from the device at every start (the RoCE v2 entry holding its IPv4 address).
gid_index = -1
# TCP ports on the CX7 addresses: NCCL bootstrap on the head (the RDMA all-reduce uses nccl_port + 1, the vision
# tower's NCCL nccl_port + 2) and the command link on the worker.
nccl_port = 29611
link_port = 29650

[paths]
# The checkpoint folder (nvidia/Qwen3.8-Flash-Next-FP4-Local: config.json, tokenizer, tensors/), the same path on both
# nodes. Required.
weights = ""
# Where ./start.sh download gets the checkpoint: Hugging Face repo and commit (a prefix of the commit hash is enough).
weights_repo = "nvidia/Qwen3.8-Flash-Next-FP4-Local"
weights_revision = "b9ce18a6887e18c089fdea8509a33e63429a3300"
# Build cache, logs and the tensor table; the same path on both nodes. Relative paths are inside the repo.
work = ".work"
# The repo on the worker; empty = the same path as on the head. ./start.sh copies the head's repo there.
worker_repo = ""
# Docker image name; the tag comes from docker/dev.Dockerfile (a changed file is a new tag).
image = "qwen38-engine/dev"

[server]
served_name = "Qwen/Qwen3.8-Flash-Next"
host = "0.0.0.0"
port = 8888
slots = 8               # requests served at the same time
context = 655360        # tokens per request (prompt + output); up to 1,048,576 with model.yarn_factor 4
chunk = 16384           # prompt rows per prefill step
draft_depth = 4         # MTP drafts per round
# Prefix checkpoints shared by all slots (≈ 55 MiB each): while a prompt is read, its state is kept at the start of its
# last message, 1,024 tokens before its end and at its last chunk boundary, so a later prompt that shares the text but
# differs after one of those points reads only the rest. With kv_pool their memory is free pool room (taken when one is
# kept, given back when it is dropped; the least recently used of them and of the idle slots goes when room is needed),
# and this is only the most there can be; without kv_pool it is a fixed count taken at start. Each slot also keeps its
# own checkpoint before the last prompt token (the next turn), outside this count. With kv_pool a checkpoint a busy
# slot holds also starts another request with the same text on a free slot: the caches below it are shared, not
# read or stored again.
checkpoints = 128
# The requests' caches come from one pool shared by all slots, taken at start: all the memory left on the node with
# less of it, less memory_free_gib (kept free for the system), at most kv_pool_gib (0 = no cap). false: every slot gets
# `context` tokens up front. A request is let in when its prompt + min(max_tokens, output_reserve) fits in the pool;
# a longer reply takes more as it goes and ends with finish "length" only when the pool is full.
kv_pool = true
memory_free_gib = 15
kv_pool_gib = 0
output_reserve = 32768
drain_seconds = 30      # ./stop.sh: how long running requests get to finish
# Special-token text a client wrote (any added token's text, in every message incl. system, reasoning, tool-call
# arguments and tool definitions) is encoded as ordinary text, so only the chat template's own markers are control
# tokens (vLLM / HF would turn a written "<|im_end|>" into the real token). Prompts without such text: same tokens.
plain_specials = true
start_timeout = 900     # ./start.sh: seconds to wait until both ranks are ready
# Optional API key: clients then send "Authorization: Bearer <key>" for /v1/*. Put it in serve.local.toml or the
# environment (Q38_SERVER_API_KEY), not on a command line.
api_key = ""

[model]
# RoPE scaling (YaRN) of the attention layers: factor (≤ 1 = off: the checkpoint's own 262,144 positions) and the length
# its correction range is computed from (262,144 = the checkpoint's original_max_position_embeddings, as HF
# transformers; vLLM's M-RoPE uses the served window instead). server.context must stay within 262,144 × factor.
yarn_factor = 4.0
yarn_ramp = 262144

[thinking]
# Thinking-token budget per effort level (0 = no budget). When a reply's thinking reaches it, the server closes the
# thinking (</think>) and the model answers. A request's `thinking_budget` overrides it.
budget_low = 0
budget_medium = 0
budget_xhigh = 0
# A thinking loop (the last 256 thinking tokens repeat a pattern of at most 8 tokens) is closed the same way, once per
# reply.
loop_guard = true

[vision]
# Images and videos in chat messages (image_url / video_url parts). The vision tower is split over both nodes (half of
# every layer on each, ≈ 0.45 GiB of weights); at start it runs the largest picture and video once, and the KV pool is
# sized after that peak (and, on the head, the embeddings cache and one request's embeddings).
enabled = true
fetch_urls = false      # also http(s):// media URLs (the server downloads them); data: URLs always work
max_concurrent = 1      # requests whose media are encoded at the same time; the others wait their turn
max_items = 32          # images + videos in one request
max_media_tokens = 65536  # placeholder tokens of all images and videos of one request
max_item_mb = 64        # one image or video file
cache_mb = 256          # embeddings of recent files (a picture sent again skips the tower)

[patches]
# Engine patches by name (engine/src/model/patches.def), true or false. Not listed = the default there.
